name: CI/CD do GerminaFlix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Testar o validador
        run: python -B -m unittest discover -s tests -p test_validate_site.py -v
      - name: Preparar e validar o site
        id: validate
        run: |
          site_dir="$RUNNER_TEMP/germinaflix-site"
          python scripts/validate_site.py --source . --output "$site_dir" --base-path /germinaFlix/
          echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"
      - name: Enviar o artefato do Pages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ steps.validate.outputs.site_dir }}

  deploy:
    needs: ci
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
